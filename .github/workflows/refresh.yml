name: Training refresh

on:
  schedule:
    - cron: "17 6 * * 1"     # Mondays 06:17 UTC
  workflow_dispatch:          # run by hand, or call from the app's release pipeline
    inputs:
      live:
        description: "Render with Synthesia (uses credits)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-24.04   # pinned: state/ baseline was captured on this image; a new OS changes font rendering
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Capture, render, package
        env:
          SYNTHESIA_API_KEY: ${{ secrets.SYNTHESIA_API_KEY }}
          SYNTHESIA_TEST_MODE: "false"
        run: |
          for m in modules/*/; do
            python pipeline/run.py --module "$(basename "$m")" ${{ inputs.live && '--live' || '' }}
          done

      - name: Test packages in a fake LMS
        run: |
          for z in $(git ls-files --others --exclude-standard 'output/**/*.zip'); do
            python tests/test_scorm.py "$z"
          done

      # Public review site (GitHub Pages): the new version shows as "Pending review".
      # Built before the PR step, which commits output/ to the review branch.
      - name: Build review site
        run: python pipeline/pages.py --out site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      # The pull request IS the human review step: reviewers open review.html,
      # check before/after screens and narration, and merge to approve.
      - name: Open review pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: training-refresh
          title: "Training refresh: changed scenes ready for review"
          body: |
            Scheduled refresh found changes.

            **Review online:** https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
            (open the version marked *Pending review*), or open `output/<module>/<version>/review.html`.
            Check the before/after screens and narration, then merge this pull request to approve.
            Merging publishes a GitHub Release; then follow `RELEASE.md` to upload to KnowBe4.
          add-paths: |
            state/**
            output/**

      - name: Keep the bundle as a download
        uses: actions/upload-artifact@v7
        with:
          name: training-release
          path: output/
          if-no-files-found: ignore

  pages:
    needs: refresh
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
